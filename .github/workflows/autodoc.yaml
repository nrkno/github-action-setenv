on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autodoc:
    name: Auto-generated workflow documentation
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: write
    uses: nrkno/github-workflow-action-workflow-autodoc/.github/workflows/workflow.yaml@84a54022b61e892fcc09d945795771d2d3822ad7 # v1.1.4
    with:
      runs-on: '"ubuntu-latest"'
      workflow_file: action.yaml
      doc_file: README.md
      start_token: "<!-- autodoc start -->"
      end_token: "<!-- autodoc end -->"
      table: "true"
