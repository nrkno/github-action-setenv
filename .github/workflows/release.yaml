on:
  push:
    paths-ignore:
      - "**/.github/**"
      - "**README.md"
    branches:
      - main

# Nothing is granted by default; the job asks for what it needs.
permissions: {}

jobs:
  # action.yaml uses `image: Dockerfile`, so the image is built from the action ref when a
  # consumer runs it. There is no image to publish and no job holds packages: write.
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        # Credentials must stay in .git/config: semantic-release-tags runs a plain
        # `git push origin <tag> --force` that does not use GITHUB_TOKEN from the environment.
        # The token is scoped to this job (contents/issues/pull-requests write only).
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
